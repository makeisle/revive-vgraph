[package]
name = "vgraph-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "revive-vgraph MCP 서버 — 에이전트용 과업 지향 창구 (stdio, 자체 미니멀 JSON-RPC)."

[[bin]]
name = "vgraph-mcp"
path = "src/main.rs"

[dependencies]
vgraph-core.workspace = true
vgraph-engine.workspace = true
vgraph-vec.workspace = true
mcp-kit.workspace = true
serde_json.workspace = true
clap.workspace = true
anyhow.workspace = true
# 서버 모드(`serve`·`stop`·`status`) 전용 — 기능 `server` 뒤에만 켜진다.
fs4 = { version = "1", optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "signal", "time", "macros"], optional = true }
ulid = { workspace = true, optional = true }
getrandom = { version = "0.3", optional = true }
sha2 = { workspace = true, optional = true }

[features]
default = ["server"]
# 상주 HTTP 서버. 끄면 tokio·axum 없이 stdio 서버만 남는다(라이브러리 사용처는 default-features = false).
server = ["dep:fs4", "dep:tokio", "dep:ulid", "dep:sha2", "dep:getrandom", "mcp-kit/tls", "dep:winreg"]

[dev-dependencies]
rcgen = { version = "0.14.7", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tempfile.workspace = true
ureq.workspace = true

# Windows 사용자 시작 항목(레지스트리) 접근 — `service` 하위 명령 전용.
[target."cfg(windows)".dependencies]
winreg = { version = "0.56.0", optional = true }
