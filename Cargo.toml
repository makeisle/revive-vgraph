[workspace]
resolver = "2"
members = [
    "crates/vgraph-core",
    "crates/vgraph-store",
    "crates/vgraph-engine",
    "crates/vgraph-vec",
    "crates/vgraph-mcp",
    "crates/mcp-kit",
    "apps/vgraph-cli",
]

[workspace.package]
version = "0.5.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
# Local crates
vgraph-core = { path = "crates/vgraph-core" }
vgraph-store = { path = "crates/vgraph-store" }
vgraph-engine = { path = "crates/vgraph-engine" }
vgraph-vec = { path = "crates/vgraph-vec" }
mcp-kit = { path = "crates/mcp-kit" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

# External
thiserror = "2"
serde_json = "1"
smol_str = "0.3"
ulid = "1"
sha2 = "0.10"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2", features = ["json"] }
tempfile = "3"
